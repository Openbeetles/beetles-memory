[package]
name = "bm-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tauri desktop shell for Beetle Memory standalone console."

[lib]
name = "bm_desktop"
path = "src/lib.rs"

[dependencies]
bm-entry = { workspace = true, features = ["replay-harness"] }
bm-http = { path = "../../../crates/http", features = ["server-std", "replay-harness"] }
bm-ollama-transparent.workspace = true
bm-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
window-vibrancy = "0.7.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
