[package]
name = "bm-desktop"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Tauri desktop shell for Beetle Memory standalone console."

[lib]
name = "bm_desktop"
path = "src/lib.rs"

[features]
default = []
profile-desktop-macos-standalone-memory = [
    "bm-http/profile-desktop-macos-standalone-memory",
    "bm-entry/profile-desktop-macos-standalone-memory",
    "bm-sdk/profile-desktop-macos-standalone-memory",
]

[dependencies]
bm-entry.workspace = true
bm-http = { path = "../../../crates/http", features = ["server-std"] }
bm-ollama-transparent.workspace = true
bm-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
window-vibrancy = "0.7.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
