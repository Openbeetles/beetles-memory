<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Beetle Memory</title>
  <desc id="desc">A cyber beetle mark with a memory chip shell and HUD frame.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#222236"/>
      <stop offset=".58" stop-color="#141421"/>
      <stop offset="1" stop-color="#0d0d14"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a8d"/>
      <stop offset=".46" stop-color="#ff6f61"/>
      <stop offset="1" stop-color="#321921"/>
    </linearGradient>
    <linearGradient id="wingLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8f82" stop-opacity=".92"/>
      <stop offset=".52" stop-color="#ff6f61" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4ec8f4" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f82" stop-opacity=".92"/>
      <stop offset=".52" stop-color="#ff6f61" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4ec8f4" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d17"/>
      <stop offset=".5" stop-color="#111121"/>
      <stop offset="1" stop-color="#09090e"/>
    </linearGradient>
    <filter id="coralGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .32 0 0 .15  0 0 .22 0 .12  0 0 0 .7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values=".1 0 0 0 .2  0 .92 0 0 .84  0 0 1 0 1  0 0 0 .9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="1024" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 17H1024" stroke="#ffffff" stroke-opacity=".035" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#scan)" opacity=".42"/>
