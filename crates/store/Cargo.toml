[package]
name = "bm-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Owned persistence backends, schema, events, snapshots, and repair contracts for Beetle Memory."
documentation = "https://docs.rs/bm-store"

[lib]
name = "bm_store"
path = "src/lib.rs"

[features]
default = []
embedded-store = []
sqlite-store = ["dep:rusqlite"]

[dependencies]
bm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }
