[package]
name = "bm-core"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Core memory planes, recall, projection, lifecycle, and feature contracts for Beetle Memory."
documentation = "https://docs.rs/bm-core"

[lib]
name = "bm_core"
path = "src/lib.rs"

[features]
default = []
nonproduction-replay-harness = []
sqlite-index = ["dep:rusqlite"]
thread_panic_catch = []
target-esp = []
target-linux-device = []
target-desktop-macos = []
target-desktop-linux = []
target-desktop-windows = []
target-server-linux = []
role-standalone-memory = []
role-embedded-sdk = []
role-memory-gateway = []
role-dev-full = []
profile-esp-standalone-memory = ["target-esp", "role-standalone-memory"]
profile-esp-embedded-sdk = ["target-esp", "role-embedded-sdk"]
profile-linux-device-standalone-memory = ["target-linux-device", "role-standalone-memory"]
profile-desktop-macos-standalone-memory = ["target-desktop-macos", "role-standalone-memory"]
profile-desktop-macos-embedded-sdk = ["target-desktop-macos", "role-embedded-sdk"]
profile-desktop-macos-dev-full = [
    "target-desktop-macos",
    "role-dev-full",
    "nonproduction-replay-harness",
]
profile-desktop-linux-embedded-sdk = ["target-desktop-linux", "role-embedded-sdk"]
profile-desktop-windows-embedded-sdk = ["target-desktop-windows", "role-embedded-sdk"]
profile-desktop-windows-dev-full = [
    "target-desktop-windows",
    "role-dev-full",
    "nonproduction-replay-harness",
]
profile-server-linux-memory-gateway = ["target-server-linux", "role-memory-gateway"]
profile-server-linux-dev-full = [
    "target-server-linux",
    "role-dev-full",
    "nonproduction-replay-harness",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
log.workspace = true
sha2.workspace = true
rusqlite = { workspace = true, optional = true }
