[package]
name = "bm-core"
version = "0.1.0"
edition.workspace = true

[lib]
name = "bm_core"
path = "src/lib.rs"

[features]
default = []
sqlite-index = ["dep:rusqlite"]
thread_panic_catch = []
target-esp = []
target-linux-device = []
target-desktop-macos = []
target-desktop-windows = []
target-server-linux = []
role-standalone-memory = []
role-embedded-sdk = []
role-memory-gateway = []
role-dev-full = []
profile-esp-standalone-memory = ["target-esp", "role-standalone-memory"]
profile-esp-embedded-sdk = ["target-esp", "role-embedded-sdk"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
log.workspace = true
rusqlite = { workspace = true, optional = true }
