[package]
name = "bm-http"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "HTTP adapter contract surface for Beetle Memory."
documentation = "https://docs.rs/bm-http"

[lib]
name = "bm_http"
path = "src/lib.rs"

[[bin]]
name = "bm-http-console"
path = "src/bin/bm-http-console.rs"
required-features = ["server-std", "http-console-bin"]

[features]
default = []
http-console-bin = []
server-std = [
    "dep:bm-entry",
    "bm-entry/governance-model-client-std",
    "dep:bm-ollama-transparent",
]
nonproduction-replay-harness = ["bm-entry?/nonproduction-replay-harness"]
profile-esp-standalone-memory = [
    "bm-adapter/profile-esp-standalone-memory",
    "bm-entry?/profile-esp-standalone-memory",
]
profile-esp-embedded-sdk = [
    "bm-adapter/profile-esp-embedded-sdk",
    "bm-entry?/profile-esp-embedded-sdk",
]
profile-linux-device-standalone-memory = [
    "bm-adapter/profile-linux-device-standalone-memory",
    "bm-entry?/profile-linux-device-standalone-memory",
]
profile-desktop-macos-embedded-sdk = [
    "bm-adapter/profile-desktop-macos-embedded-sdk",
    "bm-entry?/profile-desktop-macos-embedded-sdk",
]
profile-desktop-macos-standalone-memory = [
    "bm-adapter/profile-desktop-macos-standalone-memory",
    "bm-entry?/profile-desktop-macos-standalone-memory",
]
profile-desktop-macos-dev-full = [
    "bm-adapter/profile-desktop-macos-dev-full",
    "bm-entry?/profile-desktop-macos-dev-full",
]
profile-desktop-linux-embedded-sdk = [
    "bm-adapter/profile-desktop-linux-embedded-sdk",
    "bm-entry?/profile-desktop-linux-embedded-sdk",
]
profile-desktop-windows-embedded-sdk = [
    "bm-adapter/profile-desktop-windows-embedded-sdk",
    "bm-entry?/profile-desktop-windows-embedded-sdk",
]
profile-desktop-windows-dev-full = [
    "bm-adapter/profile-desktop-windows-dev-full",
    "bm-entry?/profile-desktop-windows-dev-full",
]
profile-server-linux-memory-gateway = [
    "bm-adapter/profile-server-linux-memory-gateway",
    "bm-entry?/profile-server-linux-memory-gateway",
]
profile-server-linux-dev-full = [
    "bm-adapter/profile-server-linux-dev-full",
    "bm-entry?/profile-server-linux-dev-full",
]

[dependencies]
bm-adapter.workspace = true
bm-entry = { version = "0.2.0", path = "../entry", optional = true }
bm-ollama-transparent = { workspace = true, optional = true }
bm-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
