[package]
name = "bm-a2a"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Agent-to-agent adapter contract surface for Beetle Memory."
documentation = "https://docs.rs/bm-a2a"

[lib]
name = "bm_a2a"
path = "src/lib.rs"

[features]
default = []
bridge-http = ["bm-entry", "bm-entry/governance-model-client-std"]
profile-esp-standalone-memory = ["bm-adapter/profile-esp-standalone-memory"]
profile-esp-embedded-sdk = ["bm-adapter/profile-esp-embedded-sdk"]
profile-linux-device-standalone-memory = ["bm-adapter/profile-linux-device-standalone-memory"]
profile-desktop-macos-embedded-sdk = ["bm-adapter/profile-desktop-macos-embedded-sdk"]
profile-desktop-macos-dev-full = ["bm-adapter/profile-desktop-macos-dev-full"]
profile-desktop-linux-embedded-sdk = ["bm-adapter/profile-desktop-linux-embedded-sdk"]
profile-desktop-windows-embedded-sdk = ["bm-adapter/profile-desktop-windows-embedded-sdk"]
profile-desktop-windows-dev-full = ["bm-adapter/profile-desktop-windows-dev-full"]
profile-server-linux-memory-gateway = ["bm-adapter/profile-server-linux-memory-gateway"]
profile-server-linux-dev-full = ["bm-adapter/profile-server-linux-dev-full"]

[dependencies]
bm-adapter.workspace = true
bm-entry = { version = "0.2.0", path = "../entry", optional = true }
bm-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
