[package]
name = "bm-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SDK-first memory runtime facade for Beetle Memory."
documentation = "https://docs.rs/bm-sdk"

[lib]
name = "bm_sdk"
path = "src/lib.rs"

[features]
default = []
nonproduction-replay-harness = ["bm-core/nonproduction-replay-harness"]
sqlite-index = ["bm-core/sqlite-index"]
sqlite-store = ["dep:rusqlite", "dep:windows-sys"]
embedded-store = []
profile-esp-standalone-memory = [
    "bm-core/profile-esp-standalone-memory",
    "embedded-store",
]
profile-esp-embedded-sdk = [
    "bm-core/profile-esp-embedded-sdk",
    "embedded-store",
]
profile-linux-device-standalone-memory = [
    "bm-core/profile-linux-device-standalone-memory",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-desktop-macos-standalone-memory = [
    "bm-core/profile-desktop-macos-standalone-memory",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-desktop-macos-embedded-sdk = [
    "bm-core/profile-desktop-macos-embedded-sdk",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-desktop-linux-embedded-sdk = [
    "bm-core/profile-desktop-linux-embedded-sdk",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-desktop-windows-embedded-sdk = [
    "bm-core/profile-desktop-windows-embedded-sdk",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-desktop-macos-dev-full = [
    "bm-core/profile-desktop-macos-dev-full",
    "bm-core/nonproduction-replay-harness",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-desktop-windows-dev-full = [
    "bm-core/profile-desktop-windows-dev-full",
    "bm-core/nonproduction-replay-harness",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-server-linux-memory-gateway = [
    "bm-core/profile-server-linux-memory-gateway",
    "bm-core/sqlite-index",
    "sqlite-store",
]
profile-server-linux-dev-full = [
    "bm-core/profile-server-linux-dev-full",
    "bm-core/nonproduction-replay-harness",
    "bm-core/sqlite-index",
    "sqlite-store",
]

[dependencies]
bm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
