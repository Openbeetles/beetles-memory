[package]
name = "bm-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replay fixtures, harness runners, and validation gates for Beetle Memory."
documentation = "https://docs.rs/bm-replay"

[lib]
name = "bm_replay"
path = "src/lib.rs"

[features]
default = []
sqlite-store = ["bm-store/sqlite-store"]

[dependencies]
bm-core = { workspace = true, features = ["replay-harness"] }
bm-sdk.workspace = true
bm-store.workspace = true
serde.workspace = true
serde_json.workspace = true
