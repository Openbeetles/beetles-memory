[package]
name = "bm-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replay fixtures, harness runners, and validation gates for Beetle Memory."
documentation = "https://docs.rs/bm-replay"

[lib]
name = "bm_replay"
path = "src/lib.rs"

[features]
default = []
sqlite-store = ["bm-sdk/sqlite-store"]

[dependencies]
bm-core = { workspace = true, features = ["nonproduction-replay-harness"] }
bm-sdk = { workspace = true, features = ["nonproduction-replay-harness"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[build-dependencies]
sha2.workspace = true
