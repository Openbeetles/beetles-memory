[package]
name = "bm-replay"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Replay fixtures, harness runners, and validation gates for Beetle Memory."
documentation = "https://docs.rs/bm-replay"

[lib]
name = "bm_replay"
path = "src/lib.rs"

[features]
default = []
sqlite-store = ["bm-sdk/sqlite-store"]

[dependencies]
bm-core = { workspace = true, features = ["nonproduction-replay-harness"] }
bm-sdk = { workspace = true, features = ["nonproduction-replay-harness"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
libc.workspace = true
sha2.workspace = true
