[package]
name = "bm-cli"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "CLI adapter surface and platform capability inspection for Beetle Memory."
documentation = "https://docs.rs/bm-cli"

[lib]
name = "bm_cli"
path = "src/lib.rs"

[[bin]]
name = "bm"
path = "src/main.rs"

[features]
default = ["governance-model-client-std"]
governance-model-client-std = ["bm-entry/governance-model-client-std"]
profile-esp-standalone-memory = ["bm-entry/profile-esp-standalone-memory"]
profile-esp-embedded-sdk = ["bm-entry/profile-esp-embedded-sdk"]
profile-linux-device-standalone-memory = ["bm-entry/profile-linux-device-standalone-memory"]
profile-desktop-macos-standalone-memory = ["bm-entry/profile-desktop-macos-standalone-memory"]
profile-desktop-macos-embedded-sdk = ["bm-entry/profile-desktop-macos-embedded-sdk"]
profile-desktop-macos-dev-full = ["bm-entry/profile-desktop-macos-dev-full"]
profile-desktop-linux-embedded-sdk = ["bm-entry/profile-desktop-linux-embedded-sdk"]
profile-desktop-windows-embedded-sdk = ["bm-entry/profile-desktop-windows-embedded-sdk"]
profile-desktop-windows-dev-full = ["bm-entry/profile-desktop-windows-dev-full"]
profile-server-linux-memory-gateway = ["bm-entry/profile-server-linux-memory-gateway"]
profile-server-linux-dev-full = ["bm-entry/profile-server-linux-dev-full"]

[dependencies]
bm-adapter.workspace = true
bm-entry = { version = "0.6.0", path = "../entry" }
bm-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
