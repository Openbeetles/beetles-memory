[package]
name = "bm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI adapter surface and platform capability inspection for Beetle Memory."
documentation = "https://docs.rs/bm-cli"

[lib]
name = "bm_cli"
path = "src/lib.rs"

[[bin]]
name = "bm"
path = "src/main.rs"

[features]
default = []
profile-esp-standalone-memory = ["bm-adapter/profile-esp-standalone-memory"]
profile-esp-embedded-sdk = ["bm-adapter/profile-esp-embedded-sdk"]
profile-linux-device-standalone-memory = ["bm-adapter/profile-linux-device-standalone-memory"]
profile-desktop-macos-embedded-sdk = ["bm-adapter/profile-desktop-macos-embedded-sdk"]
profile-desktop-windows-embedded-sdk = ["bm-adapter/profile-desktop-windows-embedded-sdk"]
profile-server-linux-memory-gateway = ["bm-adapter/profile-server-linux-memory-gateway"]
profile-server-linux-dev-full = ["bm-adapter/profile-server-linux-dev-full"]

[dependencies]
bm-adapter.workspace = true
bm-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
