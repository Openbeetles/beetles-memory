[package]
name = "bm-llm-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "LLM protocol gateway for Beetle Memory."
documentation = "https://docs.rs/bm-llm-gateway"

[lib]
name = "bm_llm_gateway"
path = "src/lib.rs"

[[bin]]
name = "bm-llm-gateway"
path = "src/bin/bm-llm-gateway.rs"
required-features = ["server-async", "client-reqwest"]

[features]
default = []
server-async = []
client-reqwest = ["dep:reqwest"]
profile-server-linux-memory-gateway = ["bm-entry/profile-server-linux-memory-gateway"]
profile-server-linux-dev-full = ["bm-entry/profile-server-linux-dev-full"]

[dependencies]
bm-adapter.workspace = true
bm-entry.workspace = true
bm-sdk.workspace = true
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
