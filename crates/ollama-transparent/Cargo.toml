[package]
name = "bm-ollama-transparent"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Ollama transparent app mode controller for Beetle Memory."
documentation = "https://docs.rs/bm-ollama-transparent"

[lib]
name = "bm_ollama_transparent"
path = "src/lib.rs"

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
