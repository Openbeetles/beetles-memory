[package]
name = "bm-entry"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Process-level entry runtime for Beetle Memory."
documentation = "https://docs.rs/bm-entry"

[lib]
name = "bm_entry"
path = "src/lib.rs"

[features]
default = []
governance-model-client-std = ["dep:reqwest"]
nonproduction-replay-harness = [
    "dep:bm-replay",
    "bm-adapter/nonproduction-replay-harness",
]
profile-esp-standalone-memory = ["bm-adapter/profile-esp-standalone-memory"]
profile-esp-embedded-sdk = ["bm-adapter/profile-esp-embedded-sdk"]
profile-linux-device-standalone-memory = ["bm-adapter/profile-linux-device-standalone-memory"]
profile-desktop-macos-standalone-memory = ["bm-adapter/profile-desktop-macos-standalone-memory"]
profile-desktop-macos-embedded-sdk = ["bm-adapter/profile-desktop-macos-embedded-sdk"]
profile-desktop-linux-embedded-sdk = ["bm-adapter/profile-desktop-linux-embedded-sdk"]
profile-desktop-windows-embedded-sdk = ["bm-adapter/profile-desktop-windows-embedded-sdk"]
profile-server-linux-memory-gateway = ["bm-adapter/profile-server-linux-memory-gateway"]
profile-server-linux-dev-full = [
    "bm-adapter/profile-server-linux-dev-full",
    "nonproduction-replay-harness",
]
profile-desktop-macos-dev-full = [
    "bm-adapter/profile-desktop-macos-dev-full",
    "nonproduction-replay-harness",
]
profile-desktop-windows-dev-full = [
    "bm-adapter/profile-desktop-windows-dev-full",
    "nonproduction-replay-harness",
]

[dependencies]
bm-adapter.workspace = true
bm-replay = { workspace = true, optional = true }
bm-sdk.workspace = true
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url = "2.5.8"
