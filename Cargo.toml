[workspace]
members = [
    "crates/core",
    "crates/store",
    "crates/sdk",
    "crates/replay",
    "crates/evolve",
    "crates/adapter",
    "crates/entry",
    "crates/cli",
    "crates/http",
    "crates/wss",
    "crates/mcp",
    "crates/a2a",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
bm-core = { version = "0.1.0", path = "crates/core" }
bm-store = { version = "0.1.0", path = "crates/store" }
bm-sdk = { version = "0.1.0", path = "crates/sdk" }
bm-adapter = { version = "0.1.0", path = "crates/adapter" }
bm-entry = { version = "0.1.0", path = "crates/entry" }
bm-http = { version = "0.1.0", path = "crates/http" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
indexmap = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
log = "0.4"
