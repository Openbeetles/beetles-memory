[workspace]
members = [
    "crates/core",
    "crates/store",
    "crates/sdk",
    "crates/replay",
    "crates/evolve",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
bm-core = { path = "crates/core" }
bm-store = { path = "crates/store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
indexmap = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
log = "0.4"
